name: tests

# The unit tests and `cellproof verify` (which rebuilds every table from the cached model outputs): no network, no API key, no cost.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live" -q
      - run: python -m cellproof.cli verify
